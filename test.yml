apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: podinfo
  values:
    replicaCount: 2
    ui:
      message: "Hallo vanuit Flux op k3s"
    ingress:
      enabled: true
      className: traefik   # k3s levert standaard Traefik mee
      hosts:
        - host: podinfo.local
          paths:
            - path: /
              pathType: ImplementationSpecific