apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant-target-svc
  namespace: homeassistant
  labels:
    kubernetes.io/service-name: homeassistant-target-svc
addressType: IPv4 # IPv4, IPv6, or FQDN
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - "192.168.1.20"
    conditions:
      ready: true
